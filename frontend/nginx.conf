server {
    listen 80;

    resolver 10.96.0.10 valid=10s;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $backend_host "backend-service.default.svc.cluster.local";
        
        # Adding trailing slash strips '/api/' so request reaches backend as '/register'
        proxy_pass http://$backend_host:5000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Kill pending hangs with explicit timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
