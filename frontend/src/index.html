<!DOCTYPE html>
<html>
<head>
  <title>K8s Microservice Auth</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 50px; }
    .card { width: 300px; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
    input { width: 90%; margin: 8px 0; padding: 8px; }
    button { width: 98%; padding: 10px; background: #007bff; color: white; border: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>K8s Portal</h2>
    <input id="username" placeholder="Username" /><br>
    <input id="password" type="password" placeholder="Password" /><br><br>
    <button onclick="register()">Create Account</button><br><br>
    <button onclick="login()" style="background:#28a745;">Login</button>
    <p id="msg"></p>
  </div>

  <script>
    async function register() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      document.getElementById('msg').innerText = data.message || data.error;
    }

    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if(data.sessionId) {
        localStorage.setItem('sessionId', data.sessionId);
        window.location.href = '/dashboard.html';
      } else {
        document.getElementById('msg').innerText = data.error;
      }
    }
  </script>
</body>
</html>
