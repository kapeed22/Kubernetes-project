name: CI/CD Pipeline to K8s via AWS OIDC & SSM

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/k8s-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/k8s-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ env.IMAGE_BACKEND }}:${{ github.sha }} -t ${{ env.IMAGE_BACKEND }}:latest ./backend
          docker push ${{ env.IMAGE_BACKEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_BACKEND }}:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ env.IMAGE_FRONTEND }}:${{ github.sha }} -t ${{ env.IMAGE_FRONTEND }}:latest ./frontend
          docker push ${{ env.IMAGE_FRONTEND }}:${{ github.sha }}
          docker push ${{ env.IMAGE_FRONTEND }}:latest

  deploy-to-cluster:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Authenticate with AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Execute Deployment on K8s Master via AWS SSM
        run: |
          COMMANDS=$(cat << 'EOF'
          set -e
          cd /home/ubuntu/k8s-3tier-auth-app || git clone https://github.com/${{ github.repository }}.git /home/ubuntu/k8s-3tier-auth-app
          cd /home/ubuntu/k8s-3tier-auth-app
          git pull origin main

          sed -i 's|ghcr.io/YOUR_GITHUB_USERNAME/k8s-backend:latest|${{ env.IMAGE_BACKEND }}:${{ github.sha }}|g' k8s/04-backend.yaml
          sed -i 's|ghcr.io/YOUR_GITHUB_USERNAME/k8s-frontend:latest|${{ env.IMAGE_FRONTEND }}:${{ github.sha }}|g' k8s/05-frontend.yaml

          kubectl apply -f k8s/
          kubectl rollout status deployment/backend-deployment
          kubectl rollout status deployment/frontend-deployment
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.K8S_MASTER_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(echo "$COMMANDS" | jq -R -s '.')] " \
            --query "Command.CommandId" --output text)

          echo "Sent SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.K8S_MASTER_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.K8S_MASTER_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
