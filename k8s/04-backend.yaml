apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/kapeed22/k8s-backend:latest
        ports:
        - containerPort: 5000
        env:
          - name: DB_HOST
            value: "db-service.default.svc.cluster.local"
          - name: DB_PORT
            value: "5432"
          - name: REDIS_HOST
            value: "redis-service.default.svc.cluster.local"  # Or check your actual redis service name
          - name: REDIS_PORT
            value: "6379"
