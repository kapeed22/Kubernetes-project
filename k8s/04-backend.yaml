apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/YOUR_GITHUB_USERNAME/k8s-backend:latest
        ports:
        - containerPort: 5000
        env:
        - name: DB_HOST
          value: db-service
        - name: REDIS_HOST
          value: redis-service
